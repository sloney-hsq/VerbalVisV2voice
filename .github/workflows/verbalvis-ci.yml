name: VerbalVis CI

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - 'README.md'
      - 'PRIVACY.md'
      - '.github/workflows/verbalvis-ci.yml'
      - 'scripts/verify_verbalvis_release.ps1'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docs/**'
      - 'README.md'
      - 'PRIVACY.md'
      - '.github/workflows/verbalvis-ci.yml'
      - 'scripts/verify_verbalvis_release.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
