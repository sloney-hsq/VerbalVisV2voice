name: DataOps CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

# This workflow only needs to read the checkout. It deliberately has no
# deployment credentials, service-account tokens, or live Redis/Elasticsearch
# dependency.
permissions:
  contents: read

concurrency:
  group: dataops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dataops.txt

      - name: Install DataOps test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dataops.txt

      - name: Run DataOps contract suite
        run: python -m pytest tests/dataops -q
