name: Validate FD Voice

on:
  push:
    branches:
      - fd-voice
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall backend

      - name: Validate all tools and study tasks
        working-directory: backend
        run: python demo_validation.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Validate in-chart highlights
        working-directory: frontend
        run: npm run validate:highlight

      - name: Validate responsive dashboard layout
        working-directory: frontend
        run: npm run validate:layout

      - name: Build frontend
        working-directory: frontend
        run: npm run build
