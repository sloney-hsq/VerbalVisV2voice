services:
  dataops-agent:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATAOPS_DATABASE_PATH: /app/.dataops/dataops.duckdb
      DATAOPS_ELASTICSEARCH_URL: http://elasticsearch:9200
      DATAOPS_ELASTICSEARCH_INDEX: dataops-knowledge
      DATAOPS_ELASTICSEARCH_EMBEDDING_DIMENSIONS: "384"
      DATAOPS_TRACE_PATH: /app/.dataops/dataops-trace.jsonl
    command: >
      sh -c "mkdir -p /app/.dataops &&
      pip install --no-cache-dir -r requirements-dataops.txt &&
      python -m dataops_agent.knowledge.bootstrap &&
      uvicorn dataops_agent.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - dataops-elasticsearch:/usr/share/elasticsearch/data

volumes:
  dataops-elasticsearch:
