services:
  dataops-agent:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATAOPS_DATABASE_PATH: /app/.dataops/dataops.duckdb
      DATAOPS_REDIS_URL: redis://redis:6379/0
      DATAOPS_ELASTICSEARCH_URL: http://elasticsearch:9200
      DATAOPS_ELASTICSEARCH_INDEX: dataops-knowledge
    command: >
      sh -c "mkdir -p /app/.dataops &&
      pip install --no-cache-dir -r requirements-dataops.txt &&
      uvicorn dataops_agent.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started

  redis:
    image: redis:7-alpine

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - dataops-elasticsearch:/usr/share/elasticsearch/data

volumes:
  dataops-elasticsearch:
